name: Build Windows libsvn Dev Kit

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows-x64:
    runs-on: windows-latest

    env:
      BUILD_ROOT: ${{ github.workspace }}/build
      SRC_ROOT: ${{ github.workspace }}/src
      OUT_ROOT: ${{ github.workspace }}/output
      PKG_NAME: svn-dev-windows-x64

      # 固定版本，保证构建稳定
      VER_APR: 1.7.6
      VER_APR_UTIL: 1.6.3
      VER_APR_ICONV: 1.2.2
      VER_ZLIB: 1.3.1
      VER_SERF: 1.3.10
      VER_OPENSSL: 3.0.15
      VER_SVN: 1.14.6

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build prereq (Perl, NASM)
        run: |
          choco install strawberryperl nasm -y
          echo "C:\strawberry\perl\bin;C:\Program Files\NASM" >> $env:GITHUB_PATH
        shell: pwsh

      - name: Setup MSVC 2022 x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Create dir structure
        run: |
          mkdir $env:SRC_ROOT -Force
          mkdir $env:BUILD_ROOT -Force
          mkdir $env:OUT_ROOT\$env:PKG_NAME\include -Force
          mkdir $env:OUT_ROOT\$env:PKG_NAME\lib -Force
          mkdir $env:OUT_ROOT\$env:PKG_NAME\bin -Force
          mkdir $env:OUT_ROOT\$env:PKG_NAME\licenses -Force
        shell: pwsh

      - name: Download all source archives
        run: |
          cd $env:SRC_ROOT
          # APR
          Invoke-WebRequest "https://dlcdn.apache.org/apr/apr-$env:VER_APR-win32-src.zip" -OutFile apr.zip
          Invoke-WebRequest "https://dlcdn.apache.org/apr/apr-util-$env:VER_APR_UTIL-win32-src.zip" -OutFile aprutil.zip
          Invoke-WebRequest "https://dlcdn.apache.org/apr/apr-iconv-$env:VER_APR_ICONV-win32-src.zip" -OutFile apriconv.zip
          # Serf
          Invoke-WebRequest "https://dlcdn.apache.org/serf/serf-$env:VER_SERF.zip" -OutFile serf.zip
          # Zlib
          Invoke-WebRequest "https://www.zlib.net/fossils/zlib-$env:VER_ZLIB.tar.gz" -OutFile zlib.tar.gz
          # OpenSSL
          Invoke-WebRequest "https://www.openssl.org/source/openssl-$env:VER_OPENSSL.tar.gz" -OutFile openssl.tar.gz
          # Subversion
          Invoke-WebRequest "https://dlcdn.apache.org/subversion/subversion-$env:VER_SVN.zip" -OutFile subversion.zip
          # SQLite amalgamation
          Invoke-WebRequest "https://www.sqlite.org/2025/sqlite-amalgamation-3480000.zip" -OutFile sqlite.zip
        shell: pwsh

      - name: Extract all sources
        run: |
          cd $env:SRC_ROOT
          Expand-Archive apr.zip -DestinationPath apr -Force
          Expand-Archive aprutil.zip -DestinationPath apr-util -Force
          Expand-Archive apriconv.zip -DestinationPath apr-iconv -Force
          Expand-Archive serf.zip -DestinationPath serf -Force
          Expand-Archive subversion.zip -DestinationPath subversion -Force
          Expand-Archive sqlite.zip -DestinationPath sqlite -Force
          tar -zxvf zlib.tar.gz
          tar -zxvf openssl.tar.gz
          mv zlib-$env:VER_ZLIB zlib
          mv openssl-$env:VER_OPENSSL openssl
        shell: pwsh

      - name: Build APR (x64 DLL MD)
        run: |
          cd $env:SRC_ROOT\apr
          msbuild apr.vcxproj /p:Configuration=Release;Platform=x64;RuntimeLibrary=MultiThreadedDLL
          # Copy headers/libs/dlls
          Copy-Item include\* $env:OUT_ROOT\$env:PKG_NAME\include -Recurse -Force
          Copy-Item x64\Release\*.lib $env:OUT_ROOT\$env:PKG_NAME\lib -Force
          Copy-Item x64\Release\*.dll $env:OUT_ROOT\$env:PKG_NAME\bin -Force
          # Copy license
          Copy-Item LICENSE $env:OUT_ROOT\$env:PKG_NAME\licenses\APR-LICENSE -Force
        shell: pwsh

      - name: Build APR-Util
        run: |
          cd $env:SRC_ROOT\apr-util
          msbuild aprutil.vcxproj /p:Configuration=Release;Platform=x64;RuntimeLibrary=MultiThreadedDLL
          Copy-Item include\* $env:OUT_ROOT\$env:PKG_NAME\include -Recurse -Force
          Copy-Item x64\Release\*.lib $env:OUT_ROOT\$env:PKG_NAME\lib -Force
          Copy-Item x64\Release\*.dll $env:OUT_ROOT\$env:PKG_NAME\bin -Force
          Copy-Item LICENSE $env:OUT_ROOT\$env:PKG_NAME\licenses\APR-UTIL-LICENSE -Force
        shell: pwsh

      - name: Build APR-Iconv
        run: |
          cd $env:SRC_ROOT\apr-iconv
          msbuild apriconv.vcxproj /p:Configuration=Release;Platform=x64;RuntimeLibrary=MultiThreadedDLL
          Copy-Item include\* $env:OUT_ROOT\$env:PKG_NAME\include -Recurse -Force
          Copy-Item x64\Release\*.lib $env:OUT_ROOT\$env:PKG_NAME\lib -Force
          Copy-Item x64\Release\*.dll $env:OUT_ROOT\$env:PKG_NAME\bin -Force
          Copy-Item LICENSE $env:OUT_ROOT\$env:PKG_NAME\licenses\APR-ICONV-LICENSE -Force
        shell: pwsh

      - name: Build zlib shared
        run: |
          cd $env:SRC_ROOT\zlib
          nmake -f win32/Makefile.msc AS=nasm LOC=-DASMV OBJA=zlibasm.obj clean
          nmake -f win32/Makefile.msc AS=nasm LOC=-DASMV OBJA=zlibasm.obj DLL=1
          Copy-Item zconf.h,zlib.h $env:OUT_ROOT\$env:PKG_NAME\include -Force
          Copy-Item zdll.lib $env:OUT_ROOT\$env:PKG_NAME\lib -Force
          Copy-Item zlib1.dll $env:OUT_ROOT\$env:PKG_NAME\bin -Force
          Copy-Item README $env:OUT_ROOT\$env:PKG_NAME\licenses\ZLIB-LICENSE -Force
        shell: pwsh

      - name: Build SQLite amalgamation (static lib only)
        run: |
          cd $env:SRC_ROOT\sqlite
          cl /O2 /MTd- /c sqlite3.c
          lib sqlite3.obj
          Copy-Item sqlite3.h $env:OUT_ROOT\$env:PKG_NAME\include -Force
          Copy-Item sqlite3.lib $env:OUT_ROOT\$env:PKG_NAME\lib -Force
          echo "SQLite is Public Domain" | Out-File $env:OUT_ROOT\$env:PKG_NAME\licenses\SQLITE-NOTICE
        shell: pwsh

      - name: Build OpenSSL shared x64
        run: |
          cd $env:SRC_ROOT\openssl
          perl Configure VC-WIN64A shared zlib --with-zlib-include=$env:SRC_ROOT/zlib --with-zlib-lib=$env:SRC_ROOT/zlib
          nmake clean
          nmake
          Copy-Item include\openssl\*.h $env:OUT_ROOT\$env:PKG_NAME\include\openssl -Recurse -Force
          Copy-Item lib\*.lib $env:OUT_ROOT\$env:PKG_NAME\lib -Force
          Copy-Item *.dll $env:OUT_ROOT\$env:PKG_NAME\bin -Force
          Copy-Item LICENSE.txt $env:OUT_ROOT\$env:PKG_NAME\licenses\OPENSSL-LICENSE -Force
        shell: pwsh

      - name: Build Serf (HTTP/HTTPS)
        run: |
          cd $env:SRC_ROOT\serf
          msbuild serf.vcxproj /p:Configuration=Release;Platform=x64;RuntimeLibrary=MultiThreadedDLL
          Copy-Item serf.h $env:OUT_ROOT\$env:PKG_NAME\include -Force
          Copy-Item x64\Release\serf.lib $env:OUT_ROOT\$env:PKG_NAME\lib -Force
          Copy-Item x64\Release\serf.dll $env:OUT_ROOT\$env:PKG_NAME\bin -Force
          Copy-Item LICENSE $env:OUT_ROOT\$env:PKG_NAME\licenses\SERF-LICENSE -Force
        shell: pwsh

      - name: Build Subversion libsvn (no BDB, no bindings, http enabled)
        run: |
          cd $env:SRC_ROOT\subversion
          # 生成VS工程，关闭所有绑定/BDB/服务端，开启serf+openssl
          python build/generator/gen_vcxproj.py ^
            --with-apr=$env:SRC_ROOT/apr ^
            --with-apr-util=$env:SRC_ROOT/apr-util ^
            --with-apr-iconv=$env:SRC_ROOT/apr-iconv ^
            --with-zlib=$env:SRC_ROOT/zlib ^
            --with-sqlite=$env:SRC_ROOT/sqlite ^
            --with-serf=$env:SRC_ROOT/serf ^
            --with-openssl=$env:SRC_ROOT/openssl ^
            --without-berkeley-db ^
            --without-swig ^
            --without-python ^
            --without-perl ^
            --without-javahl ^
            --disable-mod-dav-svn ^
            --disable-svnserve
          msbuild subversion_vcnet.sln /p:Configuration=Release;Platform=x64;RuntimeLibrary=MultiThreadedDLL
          # Copy svn headers
          Copy-Item subversion\include\* $env:OUT_ROOT\$env:PKG_NAME\include -Recurse -Force
          Copy-Item subversion\build\win32\output\x64\Release\libsvn_*.lib $env:OUT_ROOT\$env:PKG_NAME\lib -Force
          Copy-Item subversion\build\win32\output\x64\Release\libsvn_*.dll $env:OUT_ROOT\$env:PKG_NAME\bin -Force
          Copy-Item LICENSE,NOTICE $env:OUT_ROOT\$env:PKG_NAME\licenses\ -Force
        shell: pwsh

      - name: Package dev kit zip
        run: |
          cd $env:OUT_ROOT
          Compress-Archive -Path $env:PKG_NAME -DestinationPath $env:PKG_NAME.zip
        shell: pwsh

      - name: Upload Release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.OUT_ROOT }}/${{ env.PKG_NAME }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
