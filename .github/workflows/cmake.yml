# cmake.yml -- Configuration for CMake GitHub Action workflow.
#

name: CMake

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows, shared, x64, vs2022
            os: windows-2022
            build_shared: ON
            cmake_generator: 'Visual Studio 17 2022'
            vcpkg_triplet: x64-windows
            arch: x64
            artifact_name: svn-sdk-windows-x64.zip
          - name: Linux, shared, x64
            os: ubuntu-latest
            cmake_generator: Ninja
            build_shared: ON
            artifact_name: svn-sdk-linux-x64.tar.gz
          - name: Mac OS, shared, x64
            os: macos-latest
            build_shared: ON
            cmake_generator: Ninja
            artifact_name: svn-sdk-macos-x64.tar.gz

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    env:
      CMAKE_GENERATOR: ${{ matrix.cmake_generator }}

    steps:
      - name: Prepare Environment (Windows)
        if: runner.os == 'Windows'
        run: |
          $root = &(Join-Path ${env:ProgramFiles(x86)} "\Microsoft Visual Studio\Installer\vswhere.exe") -property installationpath -latest
          Import-Module (Join-Path $root "Common7\Tools\Microsoft.VisualStudio.DevShell.dll")
          Enter-VsDevShell -VsInstallPath $root -DevCmdArguments "-arch=${{ matrix.arch }}"

          ls env: | foreach { "$($_.Name)=$($_.Value)" >> $env:GITHUB_ENV }

      - name: Get vcpkg sha (Windows, vcpkg)
        if: runner.os == 'Windows'
        id: vcpkg-sha
        run: |
          cd C:\vcpkg
          $sha = git rev-parse HEAD
          echo "sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Restore vcpkg archives (Windows, vcpkg)
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v5
        with:
          path: vcpkg-archives
          key: vcpkg/${{ runner.os }}/${{ matrix.vcpkg_triplet }}/${{ steps.vcpkg-sha.outputs.sha }}
          restore-keys: vcpkg/${{ runner.os }}/${{ matrix.vcpkg_triplet }}/

      - name: Install dependencies (Windows, vcpkg)
        if: runner.os == 'Windows'
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-archives
        run: |
          if (-not (Test-Path $env:VCPKG_DEFAULT_BINARY_CACHE)) {
            New-Item $env:VCPKG_DEFAULT_BINARY_CACHE -ItemType Directory | Out-Null
          }
          C:\vcpkg\vcpkg.exe install --triplet ${{ matrix.vcpkg_triplet }} `
            apr apr-util serf expat zlib sqlite3 gettext[tools] pdcurses

          "CMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV

      - name: Save vcpkg archives (Windows, vcpkg)
        if: runner.os == 'Windows'
        uses: actions/cache/save@v5
        with:
          path: vcpkg-archives
          key: vcpkg/${{ runner.os }}/${{ matrix.vcpkg_triplet }}/${{ steps.vcpkg-sha.outputs.sha }}

      - name: Install dependencies (Windows, python)
        if: runner.os == 'Windows'
        run: python -m pip -q --disable-pip-version-check install lxml==6.1.0 rnc2rng==2.7.0

      - name: Install dependencies (Linux, apt-get)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          libtool libtool-bin
          libapr1-dev libaprutil1-dev
          libserf-dev libexpat1-dev
          zlib1g-dev libsqlite3-dev
          ninja-build

      - name: Install dependencies (Mac OS, homebrew)
        if: runner.os == 'macOS'
        run: |
          $packages = @('apr', 'apr-util', 'expat', 'sqlite', 'apache-serf',
                        'gettext', 'ncurses')
          brew install ninja apache2 $packages
          $PKG_CONFIG_PATH = `
            $packages | `
            % { "$(& brew --prefix $_)/lib/pkgconfig" } | `
            Join-String -Separator ':'
          "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"  >> $env:GITHUB_ENV

      - name: Use LF for Git checkout
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v6

      - name: gen-make
        run: python ./gen-make.py -t cmake

      - name: Configure CMake
        run: >
          if ($env:RUNNER_OS -eq 'Windows') {
            $env:PATH += ";${env:VCPKG_ROOT}\installed\${{ matrix.vcpkg_triplet }}\bin";
          };
          cmake -B out
          -DBUILD_SHARED_LIBS=${{ matrix.build_shared }}
          -DSVN_ENABLE_TESTS=OFF
          -DSVN_ENABLE_RA_SERF=ON
          -DSVN_ENABLE_NLS=OFF
          -DSVN_ENABLE_APACHE_MODULES=OFF
          -DSVN_ENABLE_TUI=OFF
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/installdir
          -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }}
          -DSVN_INSTALL_PRIVATE_H=ON
          -DSVN_ENABLE_FS_BASE=OFF
          -DSVN_ENABLE_SWIG_PERL=OFF
          -DSVN_ENABLE_SWIG_PYTHON=OFF
          -DSVN_ENABLE_SWIG_RUBY=OFF
          -DSVN_ENABLE_PROGRAMS=OFF
          -DSVN_ENABLE_TOOLS=OFF

      - name: Build CMake
        run: cmake --build out --config Release

      - name: Install
        run: cmake --install out --config Release

      - name: Package SDK
        run: |
          if ($env:RUNNER_OS -eq 'Windows') {
            # Ensure directories exist
            New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/installdir/bin" | Out-Null
            New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/installdir/lib" | Out-Null
            New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/installdir/include" | Out-Null
            # Copy vcpkg DLLs, .lib import libraries, and public headers
            Copy-Item "C:/vcpkg/installed/${{ matrix.vcpkg_triplet }}/bin/*" -Destination "${{ github.workspace }}/installdir/bin/" -Recurse -Force -Exclude "*.pdb"
            Copy-Item "C:/vcpkg/installed/${{ matrix.vcpkg_triplet }}/lib/*" -Destination "${{ github.workspace }}/installdir/lib/" -Recurse -Force
            Copy-Item "C:/vcpkg/installed/${{ matrix.vcpkg_triplet }}/include/*" -Destination "${{ github.workspace }}/installdir/include/" -Recurse -Force
            # Use Compress-Archive to create a real .zip file
            Compress-Archive -Path "${{ github.workspace }}/installdir/*" -DestinationPath "${{ github.workspace }}/${{ matrix.artifact_name }}" -Force
          } elseif ($env:RUNNER_OS -eq 'Linux') {
            # Ensure directories exist
            New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/installdir/bin" | Out-Null
            New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/installdir/lib/pkgconfig" | Out-Null
            New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/installdir/include" | Out-Null
            # Copy system dependency .so libraries from standard multiarch paths
            $dest_bin = "${{ github.workspace }}/installdir/bin"
            $sys_libs = @(
              "/lib/x86_64-linux-gnu/libapr-1.so.0",
              "/lib/x86_64-linux-gnu/libaprutil-1.so.0",
              "/lib/x86_64-linux-gnu/libserf-1.so.1",
              "/lib/x86_64-linux-gnu/libexpat.so.1",
              "/lib/x86_64-linux-gnu/libssl.so.3",
              "/lib/x86_64-linux-gnu/libcrypto.so.3",
              "/lib/x86_64-linux-gnu/libz.so.1",
              "/lib/x86_64-linux-gnu/libsqlite3.so.0"
            )
            foreach ($lib in $sys_libs) {
              if (Test-Path $lib) { Copy-Item $lib -Destination $dest_bin -Force }
              # Also copy the multiarch path variants
              $ma = "/usr/lib/x86_64-linux-gnu/$(Split-Path $lib -Leaf)"
              if ((Test-Path $ma) -and ($ma -ne $lib)) { Copy-Item $ma -Destination $dest_bin -Force }
            }
            # Copy pkg-config files from standard locations
            $sys_lib = "/usr/lib/x86_64-linux-gnu"
            $dest_pc = "${{ github.workspace }}/installdir/lib/pkgconfig"
            $pc_files = @(
              "$sys_lib/pkgconfig/apr-1.pc",
              "$sys_lib/pkgconfig/apr-util-1.pc",
              "$sys_lib/pkgconfig/serf-1.pc",
              "$sys_lib/pkgconfig/expat.pc",
              "/usr/lib/pkgconfig/openssl.pc",
              "$sys_lib/pkgconfig/zlib.pc",
              "$sys_lib/pkgconfig/sqlite3.pc"
            )
            foreach ($pc in $pc_files) {
              if (Test-Path $pc) { Copy-Item $pc -Destination $dest_pc -Force }
            }
            # Copy headers from standard include paths
            $sys_inc = "/usr/include"
            $dest_inc = "${{ github.workspace }}/installdir/include"
            $hdrs = @("apr-1.0","expat.h","expat_external.h","expat_config.h",
                      "openssl","serf-1","sqlite3.h","zlib.h","zconf.h")
            foreach ($h in $hdrs) {
              $s = "$sys_inc/$h"; if (Test-Path $s) { Copy-Item $s -Destination "$dest_inc/" -Recurse -Force }
            }
            tar -czf ${{ matrix.artifact_name }} -C ${{ github.workspace }}/installdir .
          } else {
            # macOS: ensure directories exist
            New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/installdir/bin" | Out-Null
            New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/installdir/lib/pkgconfig" | Out-Null
            New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/installdir/include" | Out-Null
            # macOS: copy Homebrew libraries and headers
            $brew = (brew --prefix)
            $dest_lib = "${{ github.workspace }}/installdir/lib"
            $dest_inc = "${{ github.workspace }}/installdir/include"
            $dest_bin = "${{ github.workspace }}/installdir/bin"
            $libs = @{
              "libapr-1.dylib"       = "$brew/opt/apr/lib/libapr-1.dylib"
              "libaprutil-1.dylib"   = "$brew/opt/apr-util/lib/libaprutil-1.dylib"
              "libserf-1.dylib"      = "$brew/opt/serf/lib/libserf-1.dylib"
              "libexpat.dylib"       = "$brew/opt/expat/lib/libexpat.dylib"
              "libssl.dylib"         = "$brew/opt/openssl@3/lib/libssl.dylib"
              "libcrypto.dylib"      = "$brew/opt/openssl@3/lib/libcrypto.dylib"
              "libz.dylib"           = "$brew/opt/zlib/lib/libz.dylib"
              "libsqlite3.dylib"     = "$brew/opt/sqlite/lib/libsqlite3.dylib"
            }
            foreach ($name in $libs.Keys) {
              $src = $libs[$name]
              if (Test-Path $src) { Copy-Item $src -Destination "$dest_bin/$name" -Force }
            }
            # Copy pkg-config files
            $pc_src = @("$brew/opt/apr/lib/pkgconfig/apr-1.pc","$brew/opt/apr-util/lib/pkgconfig/apr-util-1.pc","$brew/opt/serf/lib/pkgconfig/serf-1.pc","$brew/opt/expat/lib/pkgconfig/expat.pc","$brew/opt/openssl@3/lib/pkgconfig/openssl.pc","$brew/opt/zlib/lib/pkgconfig/zlib.pc","$brew/opt/sqlite/lib/pkgconfig/sqlite3.pc")
            foreach ($pc in $pc_src) {
              if (Test-Path $pc) { Copy-Item $pc -Destination "$dest_lib/pkgconfig/" -Force }
            }
            # Copy headers
            $hdrs = @("apr-1","apu.h","expat.h","expat_external.h","openssl","serf-1","sqlite3.h","zlib.h","zconf.h")
            foreach ($h in $hdrs) {
              $s = "$brew/include/$h"; if (Test-Path $s) { Copy-Item $s -Destination "$dest_inc/" -Recurse -Force }
            }
            # Fix install names: make dylibs reference @rpath relative to executable
            foreach ($name in $libs.Keys) {
              $src = "$dest_bin/$name"
              if (Test-Path $src) {
                # ensure the dylib itself has an id set
                if ($name -ne (Split-Path $src -Leaf)) { }
              }
            }
            tar -czf ${{ matrix.artifact_name }} -C ${{ github.workspace }}/installdir .
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/*/*